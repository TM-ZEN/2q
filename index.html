<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1問1答学習アプリ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>📚 1問1答学習アプリ</h1>
            <p>効率的なスキマ時間学習で目標達成！</p>
        </div>

        <div class="card">
            <h2>学習設定</h2>
            
            <h3>科目を選択してください</h3>
            <div class="subject-selector">
                <button class="subject-btn" data-subject="kagaku">科学哲学</button>
                <button class="subject-btn" data-subject="projectmanagement">プロジェクトマネジメント概論</button>
                <button class="subject-btn" data-subject="kigyoukeiei">企業経営と会計</button>
                <button class="subject-btn" data-subject="gender">ジェンダー論</button>
                <button class="subject-btn" data-subject="deeplearning">ディープラーニング1</button>
            </div>

            <div id="chapter-section" class="hidden" style="margin-top: 20px;">
                <h3>学習するチャプターを選択してください（複数選択可）</h3>
                <div id="chapter-selector" class="chapter-selector"></div>
                <div style="margin-top: 15px;">
                    <button id="select-all-chapters" class="action-btn" style="background: rgb(112, 168, 148);">すべて選択</button>
                    <button id="deselect-all-chapters" class="action-btn" style="background: rgb(176, 116, 124);">選択解除</button>
                </div>
            </div>

            <div id="generate-section" class="hidden">
                <h3>問題生成</h3>
                <div class="input-section">
                    <label for="chapter-name-input">チャプター名:</label>
                    <input type="text" id="chapter-name-input" class="memo-input" style="height: 40px;" placeholder="例: 1, 2, 3">
                </div>
                <div class="input-section">
                    <label for="memo-input">授業メモを貼り付けて問題を生成：</label>
                    <textarea id="memo-input" class="memo-input" placeholder="授業メモをここに貼り付けてください..."></textarea>
                </div>
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="generate-questions" class="generate-btn">AIで問題生成 (実験的)</button>
                    <button id="generate-prompt" class="generate-btn" style="background: rgb(112, 168, 148);">Claude用プロンプト生成</button>
                    <button id="import-questions" class="generate-btn" style="background: rgb(182, 150, 96);">生成済み問題インポート</button>
                </div>
                
                <div id="loading" class="loading hidden">問題を生成中...</div>
                
                <div id="prompt-display" class="hidden" style="margin-top: 20px;">
                    <label>以下をClaude AIにコピペしてください：</label>
                    <textarea id="prompt-text" class="memo-input" readonly style="background: rgb(30, 42, 60); height: 150px;"></textarea>
                    <button id="copy-prompt" class="action-btn">プロンプトをコピー</button>
                </div>
                
                <div id="import-area" class="hidden" style="margin-top: 20px;">
                    <label>Claude AIの回答をここに貼り付けてください：</label>
                    <textarea id="import-text" class="memo-input" placeholder="Claude AIが生成したJSON形式の問題をここに貼り付けてください..."></textarea>
                    <button id="process-import" class="action-btn">問題をインポート</button>
                </div>
            </div>

            <div id="study-section" class="hidden">
                <div class="score-display">
                    正解率: <span id="score">0</span>/<span id="total">0</span> (<span id="percentage">0</span>%)
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <button id="start-quiz" class="action-btn">学習開始 (15問)</button>
                <button id="reset-progress" class="action-btn">進捗リセット</button>
            </div>

            <div id="quiz-section" class="quiz-section">
                <div class="question-card">
                    <div id="question-meta" class="question-meta"></div>
                    <div class="question-text" id="question-text"></div>
                    <div id="options-container"></div>
                    <input type="text" id="fill-blank-input" class="fill-blank-input hidden" placeholder="答えを入力してください">
                    <div id="feedback-box" class="feedback-box hidden"></div>
                    <button id="submit-answer" class="action-btn hidden">回答</button>
                    <button id="next-question" class="action-btn hidden">次の問題</button>
                </div>
            </div>

            <div id="management-section" class="management-section hidden">
                <h3>問題管理</h3>
                <p>保存済み問題数: <span id="question-count">0</span></p>
                <button id="show-questions" class="action-btn">問題一覧表示</button>
                <button id="clear-subject-data" class="action-btn" style="background: rgb(176, 116, 124);">科目データ削除</button>
                <button id="manage-api-key" class="action-btn" style="background: rgb(87, 104, 128);">APIキー管理</button>
                <button id="debug-info" class="action-btn" style="background: rgb(88, 130, 155);">デバッグ情報</button>
                
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd;">
                    <h4>📱 デバイス間データ移行</h4>
                    <div style="margin-bottom: 15px; padding: 10px; background: rgb(30, 42, 60); border-radius: 8px;">
                        <label style="font-weight: bold; margin-bottom: 5px; display: block;">ユーザーID:</label>
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <input type="text" id="user-id-input" placeholder="共有用のユーザーIDを入力" style="flex: 1; min-width: 200px; padding: 8px; border: 1px solid rgb(58, 76, 102); border-radius: 4px;">
                            <button id="set-user-id" class="action-btn" style="background: rgb(109, 97, 160);">ID設定</button>
                        </div>
                        <small style="color: rgb(154, 171, 193); margin-top: 5px; display: block;">
                            現在のID: <span id="current-user-id">未設定</span>
                        </small>
                    </div>
                    
                    <button id="export-data" class="action-btn" style="background: rgb(112, 168, 148);">📋 データエクスポート</button>
                    <button id="import-data" class="action-btn" style="background: rgb(182, 150, 96);">📋 データインポート</button>
                    <button id="save-to-cloud" class="action-btn" style="background: rgb(68, 102, 156);">📤 クラウドに保存</button>
                    <button id="load-from-cloud" class="action-btn" style="background: rgb(88, 130, 155);">📥 クラウドから読み込み</button>
                </div>
                
                <div id="data-import-area" class="hidden" style="margin-top: 15px;">
                    <label>エクスポートしたデータを貼り付けてください：</label>
                    <textarea id="import-data-text" class="memo-input" style="height: 100px;" placeholder="エクスポートしたデータをここに貼り付けてください..."></textarea>
                    <button id="process-data-import" class="action-btn">データをインポート</button>
                </div>
                <div id="question-list" class="question-list hidden"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
